name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: 后端测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven
      - name: 单元测试 + 打包
        working-directory: backend
        run: mvn -B verify -DskipTests=false
      - name: 上传后端 Jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: appstore-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend-build:
    name: ${{ matrix.app }} 构建
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-user, frontend-author, frontend-admin]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: 安装依赖
        working-directory: ${{ matrix.app }}
        run: npm ci --registry=https://registry.npmmirror.com || npm ci
      - name: 构建
        working-directory: ${{ matrix.app }}
        run: npm run build
      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: ${{ matrix.app }}/dist
          retention-days: 7

  docker-build:
    name: Docker 镜像冒烟构建
    needs: [backend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -t appstore-backend:ci ./backend
      - name: Lint docker-compose
        run: docker compose config -q
