server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: appstore-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境建议通过环境变量覆盖数据库账号密码：setx DB_PASSWORD "你的密码"
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/appstore?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:123456}"
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password:
    database: 0
    timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.appstore.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产建议关闭SQL控制台打印，需要排查时改为 StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
# 生产环境务必通过环境变量 JWT_SECRET 覆盖默认密钥，防止Token被伪造：
#   方式一（当前会话）：$env:JWT_SECRET="你的随机密钥"
#   方式二（永久生效）：setx JWT_SECRET "你的随机密钥"
jwt:
  secret: ${JWT_SECRET:appstore-secret-key-2024-very-long-secret-key-for-jwt-token-generation}
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# 文件上传配置
file:
  upload-path: ${FILE_UPLOAD_PATH:F:/AI_full-stack_project/AppStore/uploads/}
  access-path: /uploads/

# ---- v1.3 企业级增强 ----
# 在线接口文档（Swagger 3）
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 运维监控端点（Actuator）
# 健康检查: /api/actuator/health  指标: /api/actuator/metrics  Prometheus: /api/actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 日志配置
logging:
  config: classpath:logback-spring.xml
  level:
    com.appstore: info
    org.springframework.web: info
